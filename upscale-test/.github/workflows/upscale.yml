name: Upscale test

on:
  workflow_dispatch:
    inputs:
      video:
        description: "File name inside videos/ (e.g. clip1.mp4)"
        required: true
      frames:
        description: "Frames to process (5 = quick benchmark, 0 = whole video)"
        default: "5"
      model:
        description: "Real-ESRGAN model"
        default: "RealESRGAN_x4plus"
        type: choice
        options:
          - RealESRGAN_x4plus
          - realesr-general-x4v3
          - RealESRGAN_x4plus_anime_6B

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run upscale
        env:
          VIDEO: ${{ inputs.video }}
          FRAMES: ${{ inputs.frames }}
          MODEL: ${{ inputs.model }}
        run: bash scripts/run.sh

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: upscaled-4k
          path: out/*.mp4
